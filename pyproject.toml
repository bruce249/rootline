[project]
name = "rootline"
version = "0.1.0"
description = "Find the reasoning mistake behind a failing support agent, fix it, and prove the fix."
requires-python = ">=3.12,<3.14"
dependencies = [
  "neatlogs[openai]",
  "openai",
  "mcp",
  "typer",
  "jinja2",
  "pyyaml",
  "python-dotenv",
  "tenacity",
  "pytest",
]

[project.scripts]
rootline = "rootline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["patient", "evals", "rootline", "bench"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
